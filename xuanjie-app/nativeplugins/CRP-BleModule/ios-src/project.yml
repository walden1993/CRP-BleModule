# XcodeGen 工程描述：在 Mac / 云 Mac / GitHub Actions 上把 CRP-BleModule 编成静态库
#
# 用法：
#   brew install xcodegen
#   cd xuanjie-app/nativeplugins/CRP-BleModule/ios-src
#   xcodegen generate && ./build.sh        # 产出 ../ios/libCRPBleModule.a
#
# 关键点：本插件继承 DCUniModule，编译需要 DCloud iOS 离线 SDK 的 inc/ 头文件。
# 该目录不入库（版权 + 体积），需要按 ios-src/README.md 的说明放一份到这个位置：
#
#   xuanjie-app/nativeplugins/CRP-BleModule/third_party/uni-ios-sdk/inc/
#       DCUni/DCUniModule.h
#       DCUni/DCUniDefine.h
#       ...
#
# 缺失时编译会报：'DCUni/DCUniModule.h' file not found
name: CRP-BleModule
options:
  bundleIdPrefix: com.huarong
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    # uni-app 官方要求：插件静态库关闭 bitcode，只编 arm64
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    OTHER_LDFLAGS:
      - "-ObjC"

targets:
  CRP-BleModule:
    type: library.static
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.h"
          - "*.m"
    dependencies:
      # 厂商 framework（随插件放在 ../ios/CRPSmartRing.framework）
      - framework: ./../ios/CRPSmartRing.framework
        embed: false
    settings:
      base:
        PRODUCT_NAME: CRPBleModule   # 产物必须是 libCRPBleModule.a（package.json 的 ios.libs 声明）
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        # DCloud iOS 离线 SDK 的 inc 目录（DCUni/DCUniModule.h 等）
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../third_party/uni-ios-sdk/inc"
          - "$(SRCROOT)/../third_party/uni-ios-sdk/inc/DCUni"
          - "$(SRCROOT)/../third_party/uni-ios-sdk/inc/weexHeader"
          - "$(SRCROOT)"
        # DCloud 的头文件不是 modular 的，关闭模块校验，否则会报
        # "Include of non-modular header inside framework module"
        CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES: YES

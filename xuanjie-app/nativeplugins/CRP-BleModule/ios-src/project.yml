# XcodeGen 工程描述：用于在 Mac / 云 Mac 上把 CRP-BleModule 编成静态库
#
# 用法（Mac 上）：
#   brew install xcodegen            # 只需一次
#   cd xuanjie-app/nativeplugins/CRP-BleModule/ios-src
#   xcodegen generate
#   ./build.sh                       # 产出 ../ios/libCRPBleModule.a
#
# 为什么用 XcodeGen 而不是提交 .xcodeproj：.xcodeproj 是二进制-ish 的 plist，
# 在 Windows 上生成/编辑容易出错；用 yml 描述后每次在 Mac 上重新生成最省事。
name: CRP-BleModule
options:
  bundleIdPrefix: com.huarong
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true

settings:
  base:
    # uni-app 官方要求：插件静态库必须关掉 bitcode，并指定 arm64
    ENABLE_BITCODE: NO
    ONLY_ACTIVE_ARCH: NO
    ARCHS: arm64
    BUILD_LIBRARY_FOR_DISTRIBUTION: YES
    # TODO-MAC: 按你本机 uni-app iOS 离线 SDK（或 DCloud 提供的 DCUniBase）实际路径改
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../../ios-src"
    OTHER_LDFLAGS:
      - "-ObjC"

targets:
  CRP-BleModule:
    type: library.static
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.h"
          - "*.m"
    dependencies:
      # 厂商 framework（已随插件放在 ../ios/CRPSmartRing.framework）
      - framework: ./../ios/CRPSmartRing.framework
        embed: false
    settings:
      base:
        PRODUCT_NAME: CRP-BleModule
        # 静态库不需要签名
        CODE_SIGNING_ALLOWED: NO
        SKIP_INSTALL: YES
        # uni-app iOS 离线 SDK 的 DCUniBase 头文件路径（云打包时不需要，本地编译需要）
        # TODO-MAC: 若只做云打包，可把下面这行删掉，改为在 Xcode 里手动加 DCUniBase 头
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../../../ios-src"
          - "$(SRCROOT)/../../../../DCUniBase"

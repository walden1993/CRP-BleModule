# GitHub Actions：在云端 macOS 上编译 iOS 原生插件静态库
#
# 为什么需要它：
#   本机是 Windows（没有 Xcode），手上那台 Mac mini 2014 最高只能装 Xcode 14.3.1（iOS 16.4 SDK），
#   而厂商 CRPSmartRing.framework 是用 Xcode 26.3 / iOS 26.2 SDK 编的。GitHub 的 macOS runner
#   自带较新的 Xcode，可以免费把 libCRPBleModule.a 编出来。
#
# 重要前置：本插件继承 DCUniModule，编译需要 DCloud iOS 离线 SDK 的 inc/ 头文件。
#   把 SDK 里的 inc 目录放到仓库的这个位置（不入 git 也可以，但要一起 push）：
#     xuanjie-app/nativeplugins/CRP-BleModule/third_party/uni-ios-sdk/inc/
#   缺了会在 "Check DCloud headers" 这步直接报错并提示。
#
# 用法：
#   1) push 代码（或网页上传）
#   2) Actions → build-ios-plugin → Run workflow
#   3) 成功后下载 artifact: libCRPBleModule-arm64
#   4) 解压出的 libCRPBleModule.a 放回 xuanjie-app/nativeplugins/CRP-BleModule/ios/

name: build-ios-plugin

on:
  # 手动触发
  workflow_dispatch:
  # 允许用 GitHub API（contents:write 权限即可）触发，CI 可从外部一键重跑
  repository_dispatch:
    types: [build-ios-plugin]

concurrency:
  group: build-ios-plugin
  cancel-in-progress: true

jobs:
  build:
    # macos-15 自带 Xcode 16.x；如仓库可用 macos-26 可改成它（厂商 framework 是 Xcode 26.3 编的）
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks | tail -12

      - name: Check vendor framework
        run: |
          FW="xuanjie-app/nativeplugins/CRP-BleModule/ios/CRPSmartRing.framework"
          test -d "$FW" || { echo "::error::缺少 $FW"; exit 1; }
          echo "framework DTSDKName:"; /usr/libexec/PlistBuddy -c "Print :DTSDKName" "$FW/Info.plist" || true

      - name: Check DCloud headers
        run: |
          INC="xuanjie-app/nativeplugins/CRP-BleModule/third_party/uni-ios-sdk/inc"
          if [ ! -f "$INC/DCUni/DCUniModule.h" ]; then
            echo "::error::缺少 DCloud 头文件 $INC/DCUni/DCUniModule.h"
            echo "解决：从 DCloud「iOS 离线 SDK」包里取出 SDK/inc 目录，放到"
            echo "      xuanjie-app/nativeplugins/CRP-BleModule/third_party/uni-ios-sdk/inc/"
            echo "      下载页：https://nativesupport.dcloud.net.cn/AppDocs/download/ios"
            exit 1
          fi
          echo "已找到 DCUni 头文件："; ls "$INC/DCUni" | head -10

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build static library
        working-directory: xuanjie-app/nativeplugins/CRP-BleModule/ios-src
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Verify artifact
        run: |
          A="xuanjie-app/nativeplugins/CRP-BleModule/ios/libCRPBleModule.a"
          test -f "$A" || { echo "::error::没有产出 $A"; exit 1; }
          ls -lh "$A"
          lipo -info "$A" || true
          nm -gU "$A" 2>/dev/null | grep -i "CRPBleModule" | head -5 || echo "(符号检查跳过)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libCRPBleModule-arm64
          path: xuanjie-app/nativeplugins/CRP-BleModule/ios/libCRPBleModule.a
          if-no-files-found: error
